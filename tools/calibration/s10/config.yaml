# S10 标定与自检工具的配置——每个键都注明谁在读它。
#
# 只列本子树真正用到的键：roboarm 原版 config.yaml 里的大模型、语音、象棋、
# 主从臂、lerobot、数据集录制等配置这里都没有（那属于 roboarm 工程，不属于标定工具）。

# ===== 机械臂 =====
# CAN 口：默认自动探测（同臂原语，按 sysfs 拓扑认 USB-CAN，接口名会漂也不怕）。
# 这里只在探测不到 USB-CAN 时当退路用，写死名字反而容易踩到旧名字。
arm_port: ""

# 机械臂类型；robot/arm.py 按它选后端（本子树只带 piper 后端）
arm_type: piper

# 关节角向量允许的均方误差阈值（平方度），小于它算到位
arm_reach_mse_threshold_deg2: 1.0

# 抓取动作之间的停顿（秒）
catch_time_interval_s: 0.5

# 读关节角的重试次数
get_arm_angles_retry_times: 3

# 抓取/放置时夹爪尖的高度基准（臂基座系，米）= 实测桌面 z + 2cm 余量。
# 桌面 z 用标定台的「测桌面 z」那页实测（存 artifacts/desktop_z.json）；
# S10 实测桌面 z = -0.02629 → 这里 -0.00629。
# 换桌面或重装相机后要重新实测再回填。
default_desktop_height: -0.00629

# 抓取前抬起、放置前抬起的高度（米）
catch_raise_height: 0.1
place_raise_height: 0.1

# 夹爪闭合阈值 [0,1]：小于它认为没夹住
default_gripper_close_threshold: 0.05

# 放置时是否先下降到落点再张开夹爪
go_down_before_open_gripper_in_place: true

# 抓完把臂移到旁边（[x, y, z]，米），免得挡住视野；不设则不动
# default_gripper_aside_pos: [0.0, 0.2, 0.15]

# ===== 取图 =====
# 取图没有开关、也没有配置：所有人（标定台、抓取自检、相机原语）都走
# pyrealsense2 + 手动 AE、1280x720x30——标定必须与原语看到同一份画面，
# 见 vision/camera.py 的文件头。

# ===== 抓取自检（标定台的「抓取自检」那页）=====
# YOLO 权重（OBB，含 tomato/potato/carrot 三类），路径相对 s10/ 根目录
yolo_model_path: models/acm.pt

# YOLO 置信度阈值
default_conf_thres: 0.5

# 抓取点向外偏移（米），避免夹爪正好顶到物体
catch_offset: 0.00

# 离放置点多近就不抓（米），避免反复抓放
place_distance_threshold: 0.00

# 各类别的放置位置 (x, y)，单位米；key 要与 YOLO 的类别名一致
place_pos:
  potato:
    pos: [0.05, 0.45]
  tomato:
    pos: [0.05, 0.45]
  carrot:
    pos: [0.05, 0.45]
