name: internvla-navigation

services:
  internvla-server:
    image: mujue37/internvla-server:v0.1.0-jp62-t28-arm64
    runtime: nvidia
    network_mode: host
    ipc: host
    init: true
    restart: "no"
    stop_grace_period: 45s

    volumes:
      - "${MODEL_PATH:?Set MODEL_PATH in .env}:/models/InternVLA-N1-DualVLN:ro"
      - ./cache/huggingface:/root/.cache/huggingface
      - ./logs:/opt/InternNav/logs

    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_HOME: /root/.cache/huggingface

    command:
      - /bin/bash
      - -lc
      - |
        exec python -m scripts.realworld.server \
          --host "0.0.0.0" \
          --port 5801 \
          --device cuda:0 \
          --model_path /models/InternVLA-N1-DualVLN \
          --resize_w 384 \
          --resize_h 384 \
          --num_history 8 \
          --plan_step_gap 4 \
          --log-file "logs/server.log" \
          --task-source http \
          --image-source client

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:5801/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 600s