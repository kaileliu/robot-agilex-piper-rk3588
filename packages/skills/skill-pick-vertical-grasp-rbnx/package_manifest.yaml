# pick_skill_rbnx — S10 版抓取技能（grab / put_in_box / put_down + driver）。
#
# kind: skill (user-invocable atomic intent). Pilot's LLM calls
# `robonix/skill/pick/grab(object_name)` and the skill orchestrates its
# upstream services in sequence:
#   * 技能内检测 (相机帧 → YOLO 全量 + LLM 措辞匹配 / VLM 定位)
#   * service/perception/grasp_pose/grasp_request      (grasp_pose)
#   * service/manipulation/execute_grasp               (roboarm_ik)
# The object_detect service (llm_detect) is deliberately NOT used — S10 does
# not deploy it; rationale in docs/PICK_SKILL_S10_REORG.md.
#
# Upstream calls are resolved through Atlas. All of them are gRPC
# (grasp_request / execute_grasp / reset / teach_safe).
# There is intentionally no fallback to the legacy ROS service/topic path —
# the LLM-facing surface speaks robonix contracts.
#
# Lifecycle (per Robonix developer guide §5 — skills are different):
#   CMD_INIT      -> on_init: light. State machine reaches
#                    INITIALIZED at boot even if upstream peers are
#                    still warming up. cfg parsed here; the Clients and Arm
#                    objects are constructed but do not touch atlas or ROS.
#   CMD_ACTIVATE  -> on_activate: executor sends this on the FIRST
#                    LLM call. Resolve upstream endpoints (block up to
#                    60s waiting for them), hand them to the Arm, start its
#                    ROS node (joint feedback + joint_command + camera).
#   CMD_DEACTIVATE -> on_deactivate: drop endpoints; stop the ROS node and
#                    close the gRPC client cache (arm.shutdown()).
#
# Capability surface (all under robonix/skill/pick/*):
#   driver     — auto-declared by the framework (lifecycle gRPC entry).
#   grab       — MCP tool: synchronous, blocks until the grasp is verified;
#                on success leaves the object held (teach-safe pose, gripper
#                closed — 注意不是零位：那个位姿由服务端配置的
#                teach_safe_joints_deg 决定).
#   put_in_box — MCP tool: carry the held object to the box, release, home.
#   put_down   — MCP tool: open the gripper where the arm is (no arm motion).
#
# 纯臂版本（pick / pick_general / grab_general / move_arm_aside / demo）已存档到
# 纯臂副本，本包是 S10 变体。
#
# Synchronous-tool design (vs explore_rbnx's task_id model):
#   grab / put_in_box / put_down are synchronous, and the LLM-driven use case
#   is "block until done; either it worked or it didn't". So there are no
#   task_id / status / cancel siblings.
#   If async is needed later, add them as a separate breaking
#   contract bump rather than retrofitting.
#
# Config (passed via Driver(CMD_INIT, config_json)):
#   grab / put_in_box take no useful fields; total budget fixed at 60 s and
#   grab makes one grasp attempt.
#   gripper_open_width   default 0.08  — metres
#   gripper_close_width  default 0.0   — metres
#   gripper_grasp_threshold_width default 0.005 — held-object threshold
#   gripper_feedback_timeout_s default 2.0
#   gripper_joint_states_topic default "/arm/joint_states_single"
#   ── 高度模型（米，arm/base_link 坐标系）── 一个绝对量 + 两个偏移：
#   desktop_height       default 0.115 — 桌面高度。**每个部署必须自己配**：坐标系
#                        跟着臂基座走，臂装在哪儿它就在哪儿（纯臂摆实验台、
#                        S10 挂狗背，两者不共享）。没配会告警。
#   grasp_offset         default 0.02  — 贴桌高度 = desktop_height + 它：夹爪合拢、
#                        贴桌面放置都用这个高度。
#   travel_offset        default 0.10  — 腾挪高度 = desktop_height + 它：抓取悬停、
#                        抓起抬起、搬运到盒子上方、投放模式的松手点，统一用它。
#   抓取点的 z 仍由 grasp_pose 服务算（它自己的 default_desktop_height），按模型
#   应等于 desktop_height + grasp_offset；不一致时技能每次抓取都会告警。
#   旧键名 approach_dist / place_raise_height 仍接受（等同 travel_offset）。
manifestVersion: 1

package:
  name: robonix.skill.pick.vertical_grasp
  version: 0.1.0
  vendor: robonix
  description: S10 grasp skill — grab / put_in_box / put_down (piper-only capabilities live in the archived copy).
  license: MulanPSL-2.0
  tags: [skill, pick, manipulation, grasp]
  maintainers: ["lhw2002426 <lhw2002426@users.noreply.github.com>"]

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/skill/pick/driver
  - name: robonix/skill/pick/grab
  - name: robonix/skill/pick/put_in_box
  - name: robonix/skill/pick/put_down

