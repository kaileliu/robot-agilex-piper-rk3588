# Intel RealSense D435i RGBD camera primitive（pyrealsense2 直连 + 手动 AE）。
#
# 取流走容器自带的 pyrealsense2（Python SDK）打开 UVC 设备，并关闭硬件自动曝光、
# 用自己实现的手动 AE（亮度中位数 + 高光占比惩罚）——**不**使用 vendored 的
# realsense2_camera ROS 驱动，因此构建只做 codegen、也不需要 librealsense2 系统包。
#
# Atlas-registers the streams it produces under generic
# `primitive/camera/*` contracts. Consumers (scene, detect/pick 等)
# discover the topic names via atlas — no hardcoded
# `/camera_435i/...` paths on the consumer side.
#
# Lifecycle: start.sh launches the atlas bridge ONLY (no ROS spawn).
# `rbnx boot` then calls `Driver(CMD_INIT, config_json)` on the
# primitive/camera/driver gRPC interface — that handler parses config,
# opens the color+depth streams via pyrealsense2, waits for the first RGB
# frame, and only THEN declares rgb / depth / intrinsics on atlas.
#
# Capability surface (mode = abstract pattern, transport = wire):
#   primitive/camera/driver         mode=rpc        transport=gRPC
#   primitive/camera/rgb            mode=topic_out  transport=ROS2  sensor_msgs/Image (RGB8)
#   primitive/camera/depth          mode=topic_out  transport=ROS2  sensor_msgs/Image (16UC1)
#   primitive/camera/extrinsics     mode=topic_out  transport=ROS2  TransformStamped (TODO)
#   primitive/camera/snapshot       mode=rpc        transport=MCP   one-shot RGB (TODO)
#   primitive/camera/depth_snapshot mode=rpc        transport=MCP   one-shot depth (TODO)
#
# The D435i has an internal IMU (BMI055). We deliberately do NOT
# register it under `primitive/imu/imu`：该契约由本体的主 IMU（与雷达共位、
# 噪声更好，SLAM 用它）占用；相机 IMU 噪声较大，不适合做 SLAM 主源。
# 需要相机 IMU 的消费者可以直接订阅 `/<camera_name>/imu`。
#
# Config (passed via `Driver(CMD_INIT, config_json)`):
#   camera_name        default "camera_435i"           — ROS namespace
#   rgb_profile        default "640x480x30"            — color stream
#   depth_profile      default "848x480x30"            — depth stream
#   align_depth        default true                    — depth → color frame
#   spatial_filter     default true                    — reduce local disparity noise
#   temporal_filter    default true                    — stabilize depth across frames
#   hole_filling_filter default false                  — avoid inventing SLAM geometry
#   enable_imu         default true                    — published, not atlas-routed
#   sentinel_timeout_s default 30.0
manifestVersion: 1

package:
  name: robonix.primitive.intel.d435i_manual_ae.camera
  version: 0.1.0
  description: Intel RealSense D435i driver wrapper — declares RGB + depth + extrinsics contracts.
  tags: [primitive, camera, intel, realsense_d435i, rgbd]
  maintainers: [wheatfox <wheatfox17@icloud.com>]
  license: Apache-2.0

# 走 pyrealsense2（容器自带）+ UVC + 手动 AE，不构建 realsense2_camera 驱动
# → build 只做 codegen（详见 scripts/build.sh 与 README「本包怎么取流」）。
build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/primitive/camera/driver
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/camera/depth
  # intrinsics（彩色流的 CameraInfo）：代码在 Init 时真实声明；scene 的
  # ConceptGraphs 反投影依赖它。旧的 `extrinsics` 一栏与实现不符，已删。
  - name: robonix/primitive/camera/intrinsics
  - name: robonix/primitive/camera/snapshot
  - name: robonix/primitive/camera/depth_snapshot
